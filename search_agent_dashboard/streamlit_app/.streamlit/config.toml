# Match the dark palette of the original HTML. Keep both viewer modes identical
# so browser preferences and Streamlit's theme toggle cannot invert the widgets.
[theme]
base = "dark"
primaryColor = "#6b9bff"
backgroundColor = "#14171c"
secondaryBackgroundColor = "#1d2128"
textColor = "#e8eaee"
borderColor = "#2c323c"
dataframeBorderColor = "#2c323c"
dataframeHeaderBackgroundColor = "#1d2128"
dataframeHeaderTextColor = "#9aa3b2"
codeBackgroundColor = "#1d2128"
codeTextColor = "#e8eaee"
linkColor = "#6b9bff"
font = "sans-serif"

[theme.light]
primaryColor = "#6b9bff"
backgroundColor = "#14171c"
secondaryBackgroundColor = "#1d2128"
textColor = "#e8eaee"
borderColor = "#2c323c"
dataframeBorderColor = "#2c323c"
dataframeHeaderBackgroundColor = "#1d2128"
dataframeHeaderTextColor = "#9aa3b2"
codeBackgroundColor = "#1d2128"
codeTextColor = "#e8eaee"
linkColor = "#6b9bff"
font = "sans-serif"

[theme.dark]
primaryColor = "#6b9bff"
backgroundColor = "#14171c"
secondaryBackgroundColor = "#1d2128"
textColor = "#e8eaee"
