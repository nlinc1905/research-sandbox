<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}

.banner{background:var(--wa);color:#000;font-size:12px;padding:4px 20px;text-align:center}
.exp{background:var(--card);border:1px dashed var(--wa);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12px}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
select{padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
main{max-width:1100px;margin:0 auto;padding:18px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:16px}.grid .card{margin:0}.card.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.pc{cursor:pointer}
.big{font-size:28px;font-weight:700}.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.pill{padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.crumb{margin-bottom:12px}.crumb a{color:var(--ac);cursor:pointer}a{color:var(--ac)}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;min-width:80px}.bar i{display:block;height:100%}
input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.go{margin-top:8px;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.ans{white-space:pre-wrap;margin-top:12px;border-left:3px solid var(--ac);padding-left:10px}
pre{margin:0;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--tx)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.two .card{margin:0}
.msg{margin:6px 0}.msg b{color:var(--ac)}
</style></head><body>

<script>

for(var p in CU)CU[p].forEach(function(c){var ci=CL.length;CL.push({p:p,n:c});[['v1',0],['v2',0],['v2',1]].forEach(function(x){var bid=k+x[1]+1,s=bid*3+(x[0]=='v2'?7:0),v2=x[0]=='v2';B.push({id:'B-'+bid,ci:ci,v:x[0],lang:['EN','DE','EN/DE'][bid%3],n:6+Math.floor(r(bid)*20),chunk:.6+r(s+3)*.3+(v2?.04:0),emb:.68+r(s+7)*.25+(v2?.06:0),hit:.55+r(s+11)*.38,traf:200+Math.floor(r(s+5)*900),date:'Nov '+(bid%8+1)})});k+=2});

return '<div class="exp">Dashed lines on trends mark version changes: <b>v1</b> baseline, <b>v2</b> generator model A to B, <b>v3</b> vector-search tool prompt change. Every metric below is stored with the version that produced it.</div><div class="grid">'+kpi('Knowledge base quality',.78,'chunk 0.76, embedding 0.81',1)+kpi('Retrieval performance',.71,'precision 0.74, recall 0.68 (10 golden queries)',2)+kpi('Generation quality',.86,'faithfulness 0.88, relevancy 0.84',3)+stat('Latency p95','4.2s','search 1.1s, LLM 3.0s')+stat('Throughput',nn(38)+'/min','ingest '+nn(12)+' docs/hr')+'</div>'+
'<div class="grid">'+stat('Thumbs-up rate','81%','where a UI exists, '+nn(412)+' rated')+stat('Retry rate','9%','user rephrased within 2 turns')+stat('No-answer rate','6%','agent declined or empty retrieval')+stat('Avg cost / trace','$0.018','tokens summed over spans')+'</div>'+
'<div class="two"><div class="card"><h2>Who is to blame? Failure attribution</h2><div class="mu">Each failed answer is traced to the batch/doc of the chunks it used</div>'+
[['Chunking (split tables, orphan chunks)',34,'er'],['Embedding (low similarity, outliers)',18,'wa'],['Retrieval strategy (wrong tool / filter)',27,'wa'],['Generation (unfaithful to good chunks)',21,'ac']].map(function(x){return '<div style="margin-top:10px">'+x[0]+' <b>'+x[1]+'%</b><div class="bar"><i style="width:'+x[1]*2+'%;background:var(--'+x[2]+')"></i></div></div>'}).join('')+'</div>'+
'<div class="card"><h2>Worst batches by retrieval hit rate</h2><div class="sc"><table><tr><th>Batch</th><th>Ver</th><th>Customer</th><th>Hit %</th></tr>'+wb.map(function(b){var bi=B.indexOf(b);return '<tr class="cl" onclick="nv(1,'+PL.indexOf(CL[b.ci].p)+','+b.ci+','+bi+',null)"><td>'+b.id+'</td><td>'+b.v+'</td><td>'+CL[b.ci].n+'</td><td>'+pill(b.hit)+'</td></tr>'}).join('')+'</table></div><div class="mu">Click a row to drill down</div></div></div>'}

var pi=PL.indexOf(S.p),cr='<div class="crumb"><a onclick="nv(1,'+pi+',null,null,null)">Profile '+S.p+'</a>';
if(S.d!=null){var b=B[S.b],d=docs(b)[S.d];return h+cr+' / <a onclick="nv(1,'+pi+','+S.c+',null,null)">'+CL[S.c].n+'</a> / <a onclick="nv(1,'+pi+','+S.c+','+S.b+',null)">'+b.id+' ('+b.v+')</a> / '+d.name+'</div>'+docV(b,d)}
if(S.b!=null){var b=B[S.b],ds=docs(b);return h+cr+' / <a onclick="nv(1,'+pi+','+S.c+',null,null)">'+CL[S.c].n+'</a> / '+b.id+' ('+b.v+')</div><div class="grid">'+stat('Chunk score',Math.round(adj(b.chunk)*100),'')+stat('Embedding score',Math.round(adj(b.emb)*100),'')+stat('Retrieval hit %',Math.round(adj(b.hit)*100),'')+stat('Retrieval traffic',nn(b.traf),'queries')+'</div><div class="card"><h2>Documents in '+b.id+' ('+b.v+')</h2><div class="sc"><table><tr><th>Doc</th><th>Ver</th><th>Lang</th><th>Pages</th><th>Chunks</th><th>Chunk</th><th>Embedding</th><th>Retrievals</th><th>Hit %</th></tr>'+ds.map(function(d,i){return row(['nv(1,'+pi+','+S.c+','+S.b+','+i+')',d.name,b.v,d.lang,d.pages,d.chunks,pill(d.chunk),pill(d.emb),nn(d.ret),pill(d.hit)])}).join('')+'</table></div></div>'}
if(S.c!=null){var bs=B.filter(function(b){return b.ci==S.c&&vis(b)});return h+cr+' / '+CL[S.c].n+'</div><div class="card"><h2>Batches for '+CL[S.c].n+'</h2><div class="mu">The same batch appears once per version it was processed with</div><div class="sc"><table><tr><th>Batch</th><th>Ver</th><th>Ingested</th><th>Docs</th><th>Chunk score</th><th>Embedding score</th><th>Retrieval hit %</th><th>Queries</th><th>Lang</th></tr>'+bs.map(function(b){return row(['nv(1,'+pi+','+S.c+','+B.indexOf(b)+',null)','<b>'+b.id+'</b>',b.v,b.date,nn(b.n),pill(b.chunk),pill(b.emb),pill(b.hit),nn(b.traf),b.lang])}).join('')+'</table></div></div>'}
var cs=CL.map(function(c,i){return i}).filter(function(i){return CL[i].p==S.p});
return h+cr+'</div><div class="card"><h2>Customers in profile '+S.p+'</h2><div class="sc"><table><tr><th>Customer</th><th>Batches</th><th>Chunk</th><th>Embedding</th><th>Hit %</th><th>Queries</th><th>Cost</th><th>Versions</th></tr>'+cs.map(function(i){var bs=B.filter(function(b){return b.ci==i&&vis(b)});if(!bs.length)return'';return row(['nv(1,'+pi+','+i+',null,null)','<b>'+CL[i].n+'</b>',nn(2),pill(avg(bs,'chunk')),pill(avg(bs,'emb')),pill(avg(bs,'hit')),nn(avg(bs,'traf')*bs.length),'$'+(nn(bs.length*14)/10).toFixed(1),'v1, v2'])}).join('')+'</table></div><div class="mu">Click a customer to see its batches</div></div>'}
function docV(b,d){return '<div class="grid">'+stat('Chunk score',Math.round(adj(d.chunk)*100),'')+stat('Embedding score',Math.round(adj(d.emb)*100),'')+stat('Retrievals / hit %',nn(d.ret)+' / '+Math.round(adj(d.hit)*100),b.v)+'</div><div class="two"><div class="card"><h2>Chunk diagnostics</h2><div class="mu">Avg tokens 412, orphan chunks 3%, tables split across chunks 2, duplicate chunks 1%</div></div><div class="card"><h2>Recent retrievals</h2><div class="sc"><table><tr><th>Query</th><th>Chunk</th><th>Result</th></tr><tr class="cl" onclick="nv(3,null,null,null,null)"><td>Termination clause?</td><td>c-0142</td><td><span class="ok">hit</span></td></tr><tr class="cl" onclick="nv(3,null,null,null,null)"><td>Fee table 2024</td><td>c-0377</td><td><span class="er">miss</span></td></tr><tr class="cl" onclick="nv(3,null,null,null,null)"><td>Wer unterzeichnet?</td><td>c-0021</td><td><span class="wa">partial</span></td></tr></table></div><div class="mu">Click to open the trace</div></div></div>'}
var SS=[{id:'s-4412',cu:'Acme Legal',l:'EN',v:'v2',m:[['User','What is the notice period in the MSA?'],['MyAgent','90 days written notice (c-0142).'],['User','And for the 2023 amendment?'],['MyAgent','I could not find an amendment in the indexed documents.'],['User','It is in the same folder, try again'],['MyAgent','Still nothing found. Please check the file was uploaded.']],sat:.38,sent:'frustrated',goal:'unresolved',retry:1,na:2,th:'👎',cost:.061},{id:'s-4409',cu:'Northwind Support',l:'DE',v:'v2',m:[['User','Wie setze ich das Passwort zurück?'],['MyAgent','Über Einstellungen > Sicherheit (c-0021).'],['User','Danke!']],sat:.94,sent:'positive',goal:'resolved',retry:0,na:0,th:'👍',cost:.022},{id:'s-4401',cu:'Stark Invoices',l:'EN',v:'v3',m:[['User','Extract the line items from invoice 88'],['MyAgent','Found 6 line items, but 2 totals could not be matched.'],['User','Show the table'],['MyAgent','Table returned with 2 empty cells.']],sat:.55,sent:'neutral',goal:'partial',retry:0,na:0,th:'n/a',cost:.047}];

return '<div class="exp"><b>Experimental.</b> This tab needs new agent features: chats stored per session, a session id on every trace, and session-level LLM judges (today judges run per trace). All data shown is fake.</div><div class="card"><h2>Session</h2><select onchange="S.s=this.selectedIndex;draw()">'+f.map(function(x,i){return '<option'+(i==S.s?' selected':'')+'>'+x.id+' · '+x.cu+' · '+x.l+'</option>'}).join('')+'</select><div style="margin-top:10px">'+s.m.map(function(m){return '<div class="msg"><b>'+m[0]+':</b> '+m[1]+'</div>'}).join('')+'</div></div><div class="two"><div class="card"><h2>Session judge metrics (snapshot)</h2><div class="sc"><table><tr><th>Metric</th><th>Value</th></tr><tr><td>Version</td><td>'+s.v+'</td></tr><tr><td>Goal completion</td><td>'+s.goal+'</td></tr><tr><td>Inferred satisfaction</td><td>'+pill(s.sat)+'</td></tr><tr><td>Sentiment</td><td>'+s.sent+'</td></tr><tr><td>Retries / no-answers</td><td>'+s.retry+' / '+s.na+'</td></tr><tr><td>Thumbs</td><td>'+s.th+'</td></tr><tr><td>Total cost</td><td>$'+s.cost.toFixed(3)+'</td></tr><tr><td>Traces</td><td><a href="#" onclick="nv(3,null,null,null,null);return false">'+s.m.length/2+' traces</a></td></tr></table></div></div><div class="card"><h2>Ask about this session</h2><input id="q" value="Why was the user frustrated?"><button class="go" onclick="ask(\'In turn 2 the search agent found no document for the 2023 amendment (vector search returned the MSA chunks only). The user retried once and got the same result. Likely cause: the amendment was never ingested or sits in a failed batch. Check the pipeline for customer '+s.cu+'.\')">Ask</button><div id="a"></div></div></div>'}
